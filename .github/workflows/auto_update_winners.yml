name: Auto-update GulfWinners data

on:
  schedule:
    - cron: "0 */6 * * *" # Automatically fetches & updates every 6 hours (UTC)
  workflow_dispatch: # Allows manual 1-click run anytime from GitHub Actions

permissions:
  contents: write

concurrency:
  group: update-winners
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live products & image URLs from Gulf stores
        run: |
          python fetch_gulf_winners.py --out-file raw/live_fetched_products.json

      - name: Rank winners and download/sync updated product images
        run: |
          mkdir -p images
          python rank_gulf_winners.py --input-dir raw --out-dir . --download-images

      - name: Commit and push live products, rankings, and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw/live_fetched_products.json gulf_top_100_winners.json gulf_top_100_winners.csv images
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-fetch live Gulf winners & images $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
