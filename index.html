<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Winning Products — Gulf Market Rankings</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #131b33;
      --card-border: #243158;
      --text: #f3f6fc;
      --muted: #9fb0d4;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --warn: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 60px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #162242, #0f172a);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 720px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 22px;
    }

    .filter-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #06101e;
      border-color: var(--accent);
      font-weight: 700;
    }

    .status-bar {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .rank {
      font-weight: 800;
      font-size: 1rem;
      color: var(--accent);
    }

    .platform {
      font-size: 0.78rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--muted);
    }

    .title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-2);
    }

    .score {
      font-size: 0.85rem;
      color: var(--warn);
      font-weight: 600;
    }

    footer {
      margin-top: 36px;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">GULF E-COMMERCE TRACKER</div>
      <h1>Top Winning Products</h1>
      <p class="subtitle">
        Live product rankings and trend signals across Gulf marketplaces including Amazon SA, Noon, Shein, and Trendyol.
      </p>
    </header>

    <div class="controls" id="filters">
      <button class="filter-btn active" data-platform="all">All Platforms</button>
      <button class="filter-btn" data-platform="Amazon SA">Amazon SA</button>
      <button class="filter-btn" data-platform="Noon">Noon</button>
      <button class="filter-btn" data-platform="Shein">Shein</button>
      <button class="filter-btn" data-platform="Trendyol">Trendyol</button>
    </div>

    <div class="status-bar" id="statusBar">Loading product rankings...</div>
    <div class="grid" id="productGrid"></div>

    <footer>
      Top Winning Products &bull; yasirhasho.work.gd
    </footer>
  </div>

  <script>
    const sampleProducts = [
      {
        rank: 1,
        title: "Portable Mini Handheld Fan & Mist Cooler",
        platform: "Amazon SA",
        price_sar: "64 SAR",
        winner_score: "94.2"
      },
      {
        rank: 2,
        title: "Wireless Magnetic Car Phone Mount Charger",
        platform: "Noon",
        price_sar: "79 SAR",
        winner_score: "91.8"
      },
      {
        rank: 3,
        title: "Compact Travel Organizer Pouch Set (6-Pack)",
        platform: "Shein",
        price_sar: "42 SAR",
        winner_score: "89.5"
      },
      {
        rank: 4,
        title: "LED Sunset Projection Night Lamp",
        platform: "Trendyol",
        price_sar: "55 SAR",
        winner_score: "87.9"
      }
    ];

    let allProducts = sampleProducts;
    let activePlatform = "all";

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      const filtered = activePlatform === "all"
        ? allProducts
        : allProducts.filter((item) => (item.platform || "").toLowerCase() === activePlatform.toLowerCase());

      if (!filtered.length) {
        grid.innerHTML = `<div class="card"><div class="title">No products found for ${activePlatform} yet.</div></div>`;
        return;
      }

      grid.innerHTML = filtered.map((item, index) => `
        <article class="card">
          <div class="card-top">
            <span class="rank">#${item.rank || index + 1}</span>
            <span class="platform">${item.platform || "Gulf Store"}</span>
          </div>
          <h2 class="title">${item.title || item.name || "Untitled Product"}</h2>
          <div class="meta">
            <span class="price">${item.price_sar || item.price || "—"}</span>
            <span class="score">Score: ${item.winner_score || item.score || "N/A"}</span>
          </div>
        </article>
      `).join("");
    }

    async function loadData() {
      const statusBar = document.getElementById("statusBar");
      try {
        const res = await fetch("./gulf_top_100_winners.json", { cache: "no-store" });
        if (!res.ok) throw new Error("No JSON feed yet");
        const data = await res.json();
        const list = Array.isArray(data) ? data : (data.products || data.items || []);
        if (list.length > 0) {
          allProducts = list;
          statusBar.textContent = `Showing ${list.length} ranked products from gulf_top_100_winners.json`;
        } else {
          statusBar.textContent = "Showing preview winning products (JSON feed is currently empty).";
        }
      } catch (err) {
        statusBar.textContent = "Showing preview winning products. Once gulf_top_100_winners.json is generated, live data will appear automatically.";
      }
      renderProducts();
    }

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activePlatform = btn.dataset.platform;
        renderProducts();
      });
    });

    loadData();
  </script>
</body>
</html>
